name: Schermafbeelding

# Handmatig starten. Op een GitHub-testmachine:
# 1. een proeftekening en een proefproject maken,
# 2. met PDFsharp de pagina's lezen en de ramen exporteren (PdfProef),
# 3. het programma openen met het proefproject en een schermafbeelding maken.
# De uitkomsten komen op de branch 'schermafbeelding'.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Proeftekening en proefproject maken
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force uitvoer | Out-Null
          pip install pikepdf
          dotnet run --project tests/RaamTekenaar.Proef -c Release -- proef.json demo.raamproj demo.pdf
          python tests/maak_proef_pdf.py proef.json demo.pdf --zonder-ramen
          Copy-Item demo.pdf uitvoer\

      - name: PDFsharp-proef (lezen en exporteren)
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet run --project tests/RaamTekenaar.PdfProef -c Release -- demo.raamproj uitvoer\demo_ramen.pdf *>&1 | Tee-Object -FilePath uitvoer\pdfproef.txt

      - name: Publiceren
        run: dotnet publish src/RaamTekenaar.App/RaamTekenaar.App.csproj -c Release -r win-x64 -o publish

      - name: Programma starten en schermafbeelding maken
        shell: powershell
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { Write-Host "Resolutie niet aangepast: $_" }
          $project = (Resolve-Path demo.raamproj).Path
          $proc = Start-Process -FilePath (Resolve-Path publish\RaamTekenaar.exe).Path -ArgumentList "`"$project`"" -PassThru
          Start-Sleep -Seconds 20
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\uitvoer\schermafbeelding.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Write-Host "Scherm: $($b.Width) x $($b.Height); proces actief: $(-not $proc.HasExited)"
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }

      - name: Op branch 'schermafbeelding' zetten
        if: always()
        shell: pwsh
        run: |
          Set-Location uitvoer
          git init -q -b schermafbeelding
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Testuitvoer ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" schermafbeelding
