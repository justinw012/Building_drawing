name: Bouwen

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Proef rekenkern
        run: dotnet run --project tests/RaamTekenaar.Proef -c Release -- proef.json

      - name: Publiceren als één exe
        run: dotnet publish src/RaamTekenaar.App/RaamTekenaar.App.csproj -c Release -r win-x64 -o publish

      - uses: actions/upload-artifact@v5
        with:
          name: RaamTekenaar-win-x64
          path: publish/RaamTekenaar.exe

      # Elke geslaagde build op main wordt een release. Vaste downloadlink naar de nieuwste versie:
      # https://github.com/justinw012/building_drawing/releases/latest/download/RaamTekenaar.exe
      - name: Release maken
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "v0.1.${{ github.run_number }}"
          gh release create $tag publish/RaamTekenaar.exe `
            --title "Raam Tekenaar $tag" `
            --notes "Download RaamTekenaar.exe en start het programma. Er is geen installatie nodig." `
            --target "${{ github.sha }}" `
            --latest
